[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-sales-ai-crm"
version = "0.1.0"
description = "Multi-tenant AI-assisted public fund sales CRM reference implementation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "psycopg[binary]>=3.1,<4",
    "PyJWT>=2.8,<3",
    "argon2-cffi>=23,<27",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
